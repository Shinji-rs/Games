<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4c95d">
  <meta name="description" content="A collection of games made for mobile play.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css">
  <title>Games</title>
</head>
<body>
  <section class="auth-screen" id="auth-screen" aria-labelledby="login-title">
    <div class="login-form">
      <p class="eyebrow">Private access</p>
      <h1 id="login-title">Sign in</h1>
      <p class="login-copy">Use your approved Google account to open the game library.</p>

      <button class="primary-button" id="google-sign-in-button" type="button">
        <span class="google-mark" aria-hidden="true">G</span>
        Continue with Google
      </button>
      <p class="form-message" id="form-message" role="alert" aria-live="polite"></p>
    </div>
  </section>

  <header class="site-header protected-content" hidden>
    <a class="brand" href="./" aria-label="Games home">Games</a>
    <div class="header-actions">
      <span class="status">Ready to play</span>
      <button class="sign-out-button" id="sign-out-button" type="button">Sign out</button>
    </div>
  </header>

  <main class="protected-content" hidden>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Pick up and play</p>
      <h1 id="page-title">Games</h1>
      <p class="intro-copy">Games on phone.</p>
    </section>

    <section aria-labelledby="library-title">
      <div class="library-heading">
        <h2 id="library-title">Game library</h2>
        <span class="game-count">0 available</span>
      </div>

      <div class="game-grid">
        <div class="game-card coming-soon">
          <span class="card-mark" aria-hidden="true">01</span>
          <div class="card-copy">
            <h3>Game 01</h3>
            <p>Replace with a link to game</p>
          </div>
        </div>

        <div class="game-card coming-soon">
          <span class="card-mark" aria-hidden="true">02</span>
          <div class="card-copy">
            <h3>Game 02</h3>
            <p>Replace with a link to game</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="protected-content" hidden>Built for mobile.</footer>

  <script type="module" src="./app.js"></script>
</body>
</html>
