<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4c95d">
  <meta name="description" content="A collection of games made for mobile play.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <title>Games</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2528;
      --muted: #667074;
      --paper: #f7f4ec;
      --surface: #fffdf8;
      --line: #d9d5ca;
      --yellow: #f4c95d;
      --coral: #ef765f;
      --green: #5e9c76;
      --shadow: 0 12px 30px rgba(30, 37, 40, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(rgba(30, 37, 40, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(30, 37, 40, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 24px 24px;
      font-family: Georgia, "Times New Roman", serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .site-header,
    main,
    footer {
      width: min(100% - 32px, 1040px);
      margin-inline: auto;
    }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      color: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font: 700 0.72rem/1 Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .status::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      content: "";
    }

    main {
      padding: clamp(44px, 9vw, 92px) 0 64px;
    }

    .intro {
      max-width: 680px;
      animation: rise 500ms ease-out both;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--coral);
      font: 700 0.75rem/1 Arial, sans-serif;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 6.4rem);
      font-weight: 400;
      line-height: 0.95;
      text-wrap: balance;
    }

    .intro-copy {
      max-width: 540px;
      margin: 24px 0 0;
      color: var(--muted);
      font: 1rem/1.65 Arial, sans-serif;
    }

    .library-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin: clamp(56px, 10vw, 96px) 0 20px;
    }

    h2 {
      margin: 0;
      font-size: 1.45rem;
    }

    .game-count {
      color: var(--muted);
      font: 0.85rem/1 Arial, sans-serif;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .game-card {
      position: relative;
      display: grid;
      min-height: 210px;
      padding: 24px;
      overflow: hidden;
      color: inherit;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease;
      animation: rise 500ms ease-out both;
    }

    .game-card:nth-child(2) {
      animation-delay: 80ms;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 36px rgba(30, 37, 40, 0.14);
    }

    .game-card:focus-visible {
      outline: 3px solid var(--coral);
      outline-offset: 3px;
    }

    .card-mark {
      align-self: start;
      width: 58px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
      font: 700 1.4rem/1 Arial, sans-serif;
    }

    .game-card:nth-child(2) .card-mark {
      background: var(--coral);
    }

    .card-copy {
      align-self: end;
      margin-top: 36px;
    }

    .card-copy h3 {
      margin: 0 0 7px;
      font-size: 1.35rem;
    }

    .card-copy p {
      margin: 0;
      color: var(--muted);
      font: 0.9rem/1.5 Arial, sans-serif;
    }

    .coming-soon {
      border-style: dashed;
      box-shadow: none;
      cursor: default;
    }

    footer {
      padding: 24px 0 36px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      font: 0.78rem/1.5 Arial, sans-serif;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
    }

    @media (max-width: 640px) {
      .site-header,
      main,
      footer {
        width: min(100% - 24px, 1040px);
      }

      .game-grid {
        grid-template-columns: 1fr;
      }

      .game-card {
        min-height: 190px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="Games home">Games</a>
    <span class="status">Ready to play</span>
  </header>

  <main>
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Pick up and play</p>
      <h1 id="page-title">Games</h1>
      <p class="intro-copy">Games on phone.</p>
    </section>

    <section aria-labelledby="library-title">
      <div class="library-heading">
        <h2 id="library-title">Game library</h2>
        <span class="game-count">0 available</span>
      </div>

      <div class="game-grid">
        <div class="game-card coming-soon">
          <span class="card-mark" aria-hidden="true">01</span>
          <div class="card-copy">
            <h3>Game 01</h3>
            <p>Replace with a link to game</p>
          </div>
        </div>

        <div class="game-card coming-soon">
          <span class="card-mark" aria-hidden="true">02</span>
          <div class="card-copy">
            <h3>Game 02</h3>
            <p>Replace with a link to game</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>Built for mobile.</footer>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
